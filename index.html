<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>iPad 倒數計時器</title>
    <!-- PWA 標籤與設定 -->
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#000000">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="倒數計時">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-user-select: none;
        }

        body, html {
            width: 100%;
            height: 100%;
            background-color: #000000;
            color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Helvetica Neue", Arial, sans-serif;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .timer-display {
            font-size: 32vw;
            font-weight: 900;
            letter-spacing: -0.03em;
            line-height: 1;
            font-variant-numeric: tabular-nums;
            cursor: pointer;
            text-shadow: 0 0 20px rgba(255, 255, 255, 0.1);
            transition: color 0.3s ease, transform 0.1s ease;
            text-align: center;
            width: 100%;
        }

        .timer-display:active {
            transform: scale(0.98);
        }

        .timer-display.ended {
            color: #ff3b30;
            animation: pulse 1s infinite;
        }

        @keyframes pulse {
            0% { opacity: 1; }
            50% { opacity: 0.3; }
            100% { opacity: 1; }
        }

        .settings-panel {
            position: absolute;
            top: 24px;
            right: 24px;
            display: flex;
            align-items: center;
            gap: 12px;
            background: rgba(28, 28, 30, 0.85);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            padding: 12px 18px;
            border-radius: 20px;
            border: 1px solid rgba(255, 255, 255, 0.12);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.5);
            z-index: 10;
        }

        .time-inputs {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .input-group {
            display: flex;
            align-items: center;
        }

        input[type="number"] {
            width: 54px;
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 10px;
            color: #ffffff;
            font-size: 18px;
            font-weight: 600;
            text-align: center;
            padding: 6px 0;
            outline: none;
            -moz-appearance: textfield;
        }

        input[type="number"]::-webkit-inner-spin-button,
        input[type="number"]::-webkit-outer-spin-button {
            -webkit-appearance: none;
            margin: 0;
        }

        input[type="number"]:focus {
            border-color: #0a84ff;
            background: rgba(255, 255, 255, 0.18);
        }

        .colon {
            font-size: 18px;
            font-weight: bold;
            color: rgba(255, 255, 255, 0.6);
            margin: 0 2px;
        }

        .btn-group {
            display: flex;
            gap: 8px;
            margin-left: 6px;
        }

        button {
            border: none;
            border-radius: 10px;
            padding: 8px 14px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
            outline: none;
        }

        .btn-primary {
            background-color: #30d158;
            color: #000000;
        }

        .btn-primary.paused {
            background-color: #ff9f0a;
            color: #000000;
        }

        .btn-secondary {
            background-color: rgba(255, 255, 255, 0.15);
            color: #ffffff;
        }

        button:active {
            opacity: 0.7;
            transform: scale(0.95);
        }
    </style>
</head>
<body>

    <div class="settings-panel">
        <div class="time-inputs">
            <div class="input-group">
                <input type="number" id="minInput" min="0" max="999" value="15" placeholder="分">
            </div>
            <span class="colon">:</span>
            <div class="input-group">
                <input type="number" id="secInput" min="0" max="59" value="00" placeholder="秒">
            </div>
        </div>

        <div class="btn-group">
            <button id="startBtn" class="btn-primary">開始</button>
            <button id="resetBtn" class="btn-secondary">重置</button>
        </div>
    </div>

    <div class="timer-display" id="timerDisplay">15:00</div>

    <script>
        // 註冊 Service Worker 實現離線使用
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('sw.js')
                    .then(reg => console.log('離線服務註冊成功'))
                    .catch(err => console.log('離線服務註冊失敗:', err));
            });
        }

        let totalSeconds = 15 * 60;
        let initialSeconds = 15 * 60;
        let timerInterval = null;
        let isRunning = false;

        const display = document.getElementById('timerDisplay');
        const minInput = document.getElementById('minInput');
        const secInput = document.getElementById('secInput');
        const startBtn = document.getElementById('startBtn');
        const resetBtn = document.getElementById('resetBtn');

        function playBeep() {
            try {
                const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                
                osc.type = 'sine';
                osc.frequency.setValueAtTime(880, audioCtx.currentTime);
                gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
                
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                
                osc.start();
                osc.stop(audioCtx.currentTime + 0.8);
            } catch (e) {
                console.log('Audio error:', e);
            }
        }

        function updateDisplay(seconds) {
            const m = Math.floor(seconds / 60);
            const s = seconds % 60;
            const formattedM = String(m).padStart(2, '0');
            const formattedS = String(s).padStart(2, '0');
            display.textContent = `${formattedM}:${formattedS}`;
        }

        function getInputValueInSeconds() {
            const m = parseInt(minInput.value, 10) || 0;
            const s = parseInt(secInput.value, 10) || 0;
            return m * 60 + Math.min(s, 59);
        }

        function startTimer() {
            if (isRunning) return;

            if (totalSeconds <= 0) {
                totalSeconds = getInputValueInSeconds();
                initialSeconds = totalSeconds;
            }

            if (totalSeconds <= 0) return;

            isRunning = true;
            startBtn.textContent = '暫停';
            startBtn.classList.add('paused');
            display.classList.remove('ended');

            timerInterval = setInterval(() => {
                totalSeconds--;
                updateDisplay(totalSeconds);

                if (totalSeconds <= 0) {
                    clearInterval(timerInterval);
                    isRunning = false;
                    startBtn.textContent = '開始';
                    startBtn.classList.remove('paused');
                    display.classList.add('ended');
                    playBeep();
                }
            }, 1000);
        }

        function pauseTimer() {
            if (!isRunning) return;
            clearInterval(timerInterval);
            isRunning = false;
            startBtn.textContent = '繼續';
            startBtn.classList.remove('paused');
        }

        function toggleTimer() {
            if (isRunning) {
                pauseTimer();
            } else {
                startTimer();
            }
        }

        function resetTimer() {
            clearInterval(timerInterval);
            isRunning = false;
            startBtn.textContent = '開始';
            startBtn.classList.remove('paused');
            display.classList.remove('ended');

            totalSeconds = getInputValueInSeconds();
            initialSeconds = totalSeconds;
            updateDisplay(totalSeconds);
        }

        function handleInputChange() {
            let m = parseInt(minInput.value, 10);
            let s = parseInt(secInput.value, 10);

            if (isNaN(m) || m < 0) m = 0;
            if (isNaN(s) || s < 0) s = 0;
            if (s > 59) s = 59;

            minInput.value = m;
            secInput.value = String(s).padStart(2, '0');

            if (!isRunning) {
                resetTimer();
            }
        }

        startBtn.addEventListener('click', toggleTimer);
        resetBtn.addEventListener('click', resetTimer);
        display.addEventListener('click', toggleTimer);

        minInput.addEventListener('change', handleInputChange);
        secInput.addEventListener('change', handleInputChange);

        secInput.addEventListener('blur', () => {
            let s = parseInt(secInput.value, 10) || 0;
            secInput.value = String(Math.min(s, 59)).padStart(2, '0');
        });

        updateDisplay(totalSeconds);
    </script>
</body>
</html>
